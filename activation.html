<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفعيل بطاقة ZOMA</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script></head><body><div class="auth-wrap"><div class="panel auth"><a class="brand" href="index.html"><span class="brand-badge">Z</span>ZOMA</a><div id="step1"><h1>تفعيل بطاقة ZOMA</h1><p class="muted">أدخل رقم الهاتف وكلمة مرور حسابك للتأكد من ملكية البطاقة.</p><form id="loginForm" class="form"><div class="field"><label>رقم الهاتف</label><input id="phone" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div><button class="btn primary">متابعة</button></form></div><div id="step2" style="display:none"><h1>تجهيز ملف البطاقة</h1><p class="muted">أكمل البيانات التي ستظهر للزائر.</p><form id="profileForm" class="form"><div class="field"><label>الاسم</label><input id="full_name" required></div><div class="field"><label>الصورة</label><input id="photo" type="file" accept="image/*"></div><div class="grid-2"><div class="field"><label>Facebook</label><input id="facebook_url"></div><div class="field"><label>TikTok</label><input id="tiktok_url"></div><div class="field"><label>WhatsApp 1</label><input id="whatsapp_1"></div><div class="field"><label>WhatsApp 2</label><input id="whatsapp_2"></div></div><div class="field"><label>إظهار WhatsApp 2</label><select id="show_whatsapp_2"><option value="true">نعم</option><option value="false">لا</option></select></div><button class="btn primary">تفعيل البطاقة</button></form></div><div id="result" style="display:none"></div></div></div><div id="toast" class="toast"></div><script>
const id=new URLSearchParams(location.search).get('id');let card=null,user=null;if(!id){document.querySelector('.auth').innerHTML='<div class="center"><h1>رابط غير صالح</h1><p class="muted">لا يوجد Card ID.</p></div>'}else{(async()=>{const {data,error}=await sb.rpc('zoma_get_public_card',{p_card_id:id});if(error||!data||!data[0]){zoma.toast('البطاقة غير موجودة','error');return}card=data[0];if(card.status==='suspended'){zoma.toast('هذه البطاقة موقوفة','error');return}if(card.status==='active'){location.href='card/index.html?id='+encodeURIComponent(id);return}})()}
loginForm.addEventListener('submit',async e=>{e.preventDefault();const r=await sb.rpc('zoma_get_login_email',{p_identity:phone.value.trim()});if(r.error||!r.data){zoma.toast('رقم الهاتف غير مسجل','error');return}const s=await sb.auth.signInWithPassword({email:r.data,password:password.value});if(s.error){zoma.toast('رقم الهاتف أو كلمة المرور غير صحيحين','error');return}user=s.data.user;const cr=await sb.from('cards').select('*,profiles(*)').eq('card_id',id).maybeSingle();if(!cr.data||cr.data.customer_id!==user.id){await sb.auth.signOut();zoma.toast('هذا الحساب لا يملك البطاقة','error');return}card=cr.data;full_name.value=card.profiles?.full_name||'';facebook_url.value=card.profiles?.facebook_url||'';tiktok_url.value=card.profiles?.tiktok_url||'';whatsapp_1.value=card.profiles?.whatsapp_1||'';whatsapp_2.value=card.profiles?.whatsapp_2||'';show_whatsapp_2.value=String(card.profiles?.show_whatsapp_2!==false);step1.style.display='none';step2.style.display='block'});
profileForm.addEventListener('submit',async e=>{e.preventDefault();let photo_url=card.profiles?.photo_url||null;const f=photo.files[0];if(f)try{photo_url=await zoma.uploadPhoto(f)}catch(err){zoma.toast(err.message,'error');return}const payload={card_id:card.id,full_name:full_name.value,facebook_url:facebook_url.value,tiktok_url:tiktok_url.value,whatsapp_1:whatsapp_1.value,whatsapp_2:whatsapp_2.value,show_whatsapp_2:show_whatsapp_2.value==='true',photo_url};const {data:activatedCard,error}=await sb.rpc('zoma_activate_card',{p_card_id:id,p_full_name:full_name.value,p_photo_url:photo_url,p_facebook_url:facebook_url.value,p_tiktok_url:tiktok_url.value,p_whatsapp_1:whatsapp_1.value,p_whatsapp_2:whatsapp_2.value,p_show_whatsapp_2:show_whatsapp_2.value==='true'});if(error||!activatedCard){zoma.toast((error&&error.message)||'تعذر تفعيل البطاقة','error');return}card=activatedCard;result.style.display='block';result.innerHTML='<div class="notice"><h2>تم تفعيل البطاقة ✅</h2><p>يمكنك الآن استخدام الرابط أو NFC لفتح ملفك العام.</p><a class="btn primary" href="card/index.html?id='+encodeURIComponent(id)+'">فتح البطاقة</a></div>'});
</script></body></html>
