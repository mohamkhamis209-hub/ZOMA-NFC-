<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | ZOMA</title><link rel="stylesheet" href="../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script></head><body><div class="auth-wrap"><div class="panel auth"><a class="brand" href="../index.html"><span class="brand-badge">Z</span>ZOMA ADMIN</a><h1>تسجيل دخول الإدارة</h1><form id="f" class="form"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div><button class="btn primary">دخول الإدارة</button></form><div class="help muted">حساب الإدارة يتم إنشاؤه من Supabase Auth ثم يُربط بجدول admins.</div></div></div><script>f.addEventListener('submit',async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(r.error){zoma.toast(r.error.message,'error');return}const a=await zoma.isAdmin();if(!a){await sb.auth.signOut();zoma.toast('هذا الحساب ليس مشرفًا في ZOMA','error');return}location.href='dashboard.html'});</script></body></html>
